spring.application.name=claimiq-backend
spring.datasource.url=${CLAIMIQ_DB_URL}
spring.datasource.username=${CLAIMIQ_DB_USERNAME}
spring.datasource.password=${CLAIMIQ_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info

claimiq.security.issuer-uri=${CLAIMIQ_JWT_ISSUER:}
claimiq.security.audience=${CLAIMIQ_JWT_AUDIENCE:}

# Documentation is enabled only by local/demo profiles.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api-docs

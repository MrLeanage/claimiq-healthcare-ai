# Activate with demo: local demo JWTs with durable SQL Server storage.
# Windows authentication uses the identity running Java.
spring.datasource.url=${CLAIMIQ_DEMO_DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=ClaimIQ;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

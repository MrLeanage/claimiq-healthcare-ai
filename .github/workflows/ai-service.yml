name: AI service verification
on:
  pull_request:
    paths: ['ai-service/**', 'backend/**', '.github/workflows/ai-service.yml']
  push:
    branches: [main, feature/claim-denial-assessment]
    paths: ['ai-service/**', '.github/workflows/ai-service.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check app tests train.py
      - run: python -m unittest discover -s tests -v
      - name: Verify reproducible model artifact
        run: |
          python train.py
          git diff --exit-code -- app/ml/synthetic-model.json

name: Windows native launcher verification
on:
  push:
    branches: [main, feature/native-service-launcher]
    paths: ['dev.ps1', 'dev.cmd', 'scripts/**', 'ai-service/serve.py', 'ai-service/dev.ps1', '.github/workflows/native-launcher.yml']
  pull_request:
    paths: ['dev.ps1', 'dev.cmd', 'scripts/**', 'ai-service/serve.py', 'ai-service/dev.ps1', '.github/workflows/native-launcher.yml']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: npm ci
        working-directory: frontend
      - run: .\mvnw.cmd -B -DskipTests package
        working-directory: backend
      - name: Windows PowerShell lifecycle integration
        shell: powershell
        run: .\scripts\Test-ServerLifecycle.ps1
      - name: Parse the command wrapper
        shell: cmd
        run: dev.cmd help
